<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 C 오락실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root {
  --cab: #ff6a1a;
  --cab-dk: #c94b0c;
  --plastic: #1a1714;
  --screen: #06080b;
  --white: #f4f1e8;
  --yel: #ffd23f;
  --red: #ff3b30;
  --teal: #2ec4b6;
  --gray: #7d7a72;
  --px: 'Galmuri11', 'Galmuri9', monospace;
  --px-big: 'Galmuri14', 'Galmuri11', monospace;
  --px-sm: 'Galmuri9', 'Galmuri11', monospace;
  --toast-bg: var(--yel);
  --toast-fg: var(--plastic);
  --toast-font: var(--px);
  --toast-radius: 0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; font: 13px/1.5 var(--px); color: var(--white);
  background-color: var(--cab);
  background-image:
    linear-gradient(112deg, transparent 0 58%, var(--yel) 58% 63%, transparent 63% 65.5%, var(--yel) 65.5% 67%, transparent 67%),
    radial-gradient(circle, var(--cab-dk) 1.3px, transparent 1.7px);
  background-size: 100% 100%, 9px 9px;
  background-attachment: fixed;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; }

.cabinet {
  max-width: 1080px; margin: 0 auto; min-height: 100vh; padding: 14px 18px 0;
  display: grid; grid-template-rows: auto 1fr auto auto; gap: 0;
}

/* marquee */
.marquee {
  position: relative; height: 74px; border-radius: 10px 10px 0 0;
  background: var(--plastic); padding: 8px; box-shadow: inset 0 -4px 0 #000;
}
.marquee__glass {
  height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  background:
    repeating-linear-gradient(90deg, rgb(255 255 255 / .05) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, #fff3c4, var(--yel) 40%, #f2b51b);
  color: var(--plastic);
}
.marquee h1 { margin: 0; font: 700 30px/1 var(--px-big); letter-spacing: .04em; text-shadow: 3px 3px 0 var(--cab); }
.marquee p { margin: 0; font: 12px/1.3 var(--px); text-align: right; }
.marquee.is-booting .marquee__glass { animation: tube 1s steps(1) 1; }
@keyframes tube { 0%, 20%, 45% { filter: brightness(.35); } 10%, 30%, 60%, 100% { filter: none; } }

/* bezel + CRT */
.bezel { background: var(--plastic); padding: 22px 26px 26px; display: flex; min-height: 0; }
.screen {
  position: relative; flex: 1; min-height: 470px; overflow: hidden; border-radius: 22px / 18px;
  background: radial-gradient(ellipse at 50% 45%, #10161c, var(--screen) 70%);
  box-shadow: inset 0 0 0 3px #000, inset 0 0 60px rgb(0 0 0 / .9);
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 18px 22px 14px; gap: 14px;
}
.screen > * { min-width: 0; }
.screen::after { /* scanlines + glass */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background:
    repeating-linear-gradient(0deg, rgb(0 0 0 / .28) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 30% 20%, rgb(255 255 255 / .06), transparent 40%),
    radial-gradient(ellipse at 50% 50%, transparent 62%, rgb(0 0 0 / .55));
}
.screen.is-booting > * { visibility: hidden; }
.screen.is-booting::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; z-index: 6;
  background: var(--white); box-shadow: 0 0 18px 4px rgb(244 241 232 / .7);
  animation: crt 0.9s cubic-bezier(.7, 0, .2, 1) forwards;
}
@keyframes crt {
  0% { transform: scaleX(0); opacity: 1; }
  40% { transform: scaleX(1); height: 3px; top: 50%; opacity: 1; }
  100% { transform: scaleX(1); height: 100%; top: 0; margin-top: 0; opacity: 0; }
}

.hud { display: flex; align-items: center; gap: 16px; font-size: 12px; }
.hud__credit { color: var(--yel); }
.hud__msg { margin-left: auto; margin-right: auto; color: var(--white); }
.sound { background: none; border: 1px solid #3b3a36; padding: 3px 8px; cursor: pointer; font-size: 11px; }
.sound[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); }

.modes { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; grid-column: 1 / -1; }
.modes::-webkit-scrollbar { display: none; }
.modes__key { flex: none; color: var(--gray); font-size: 11px; padding: 0 6px; }
.mode { flex: none; background: none; border: 0; padding: 5px 10px; cursor: pointer; color: var(--gray); font-size: 13px; }
.mode:hover { color: var(--white); }
.mode[aria-pressed="true"] { background: var(--yel); color: var(--plastic); }

.main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; min-height: 0; }

.preview { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; min-height: 0; }
.preview__monitor { position: relative; aspect-ratio: 4 / 3; background: #000; border: 2px solid #2a2a2a; }
.preview__monitor canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.preview__tag {
  position: absolute; left: 8px; top: 8px; z-index: 2; padding: 2px 6px; font-size: 11px; background: var(--teal); color: var(--plastic);
}
.preview__tag[hidden] { display: none; }
.preview h2 { margin: 0; font: 700 26px/1.15 var(--px-big); color: var(--white); text-shadow: 3px 3px 0 #3a1708; }
.stats { margin: 0; display: grid; grid-template-columns: 44px 1fr; gap: 3px 10px; font-size: 13px; }
.stats dt { color: var(--gray); }
.stats dd { margin: 0; }
.prompt { margin: 6px 0 0; color: var(--yel); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.grid {
  list-style: none; margin: 0; padding: 0; align-content: start;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
}
.tile {
  position: relative; display: block; aspect-ratio: 1; text-decoration: none; background: #111;
  border: 2px solid #2b2b2b; cursor: pointer; outline: none;
}
.tile canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; filter: saturate(.85) brightness(.8); transition: filter .1s; }
.tile__no { position: absolute; left: 4px; top: 2px; font: 11px/1.2 var(--px-sm); color: var(--white); text-shadow: 1px 1px 0 #000; }
.tile__ext { position: absolute; right: 0; bottom: 0; font: 10px/1 var(--px-sm); padding: 3px 4px 2px; background: var(--teal); color: var(--plastic); }
.tile.is-sel { border-color: var(--red); }
.tile.is-sel canvas { filter: none; }
.tile.is-sel::before, .tile.is-sel::after { /* 1P cursor brackets */
  content: ""; position: absolute; inset: -9px; pointer-events: none;
  border: 3px solid var(--red);
  clip-path: polygon(0 0, 30% 0, 30% 4px, 4px 4px, 4px 30%, 0 30%, 0 70%, 4px 70%, 4px calc(100% - 4px), 30% calc(100% - 4px), 30% 100%, 70% 100%, 70% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 70%, 100% 70%, 100% 30%, calc(100% - 4px) 30%, calc(100% - 4px) 4px, 70% 4px, 70% 0, 100% 0, 100% 100%, 0 100%);
  animation: blink .5s steps(1) infinite;
}
.tile.is-sel::after { content: "1P"; inset: auto auto calc(100% + 6px) -2px; border: 0; clip-path: none; background: var(--red); color: var(--white); font: 11px/1 var(--px-sm); padding: 3px 5px 2px; animation: none; }
.tile.is-confirm canvas { animation: flash .12s steps(1) 4; }
@keyframes flash { 50% { filter: brightness(3) saturate(0); } }
.tile.is-in { animation: tileIn .28s steps(4) backwards; }
@keyframes tileIn { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.empty { grid-column: 1 / -1; color: var(--gray); }

.help { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11px; color: var(--gray); }
.help b { color: var(--white); font-weight: 400; }
.coin-btn { margin-left: auto; background: none; border: 0; padding: 0; cursor: pointer; color: var(--yel); font-size: 12px; animation: blink 1.2s steps(1) infinite; }

.overlay {
  position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center;
  background: rgb(6 8 11 / .9);
}
.overlay[hidden] { display: none; }
.overlay__big { font: 700 64px/1 var(--px-big); color: var(--yel); text-shadow: 5px 5px 0 var(--cab-dk); }
.overlay__small { margin-top: 14px; font-size: 13px; color: var(--white); }
.contact { width: min(420px, 90%); text-align: left; }
.contact h2 { margin: 0 0 4px; font: 700 26px/1.2 var(--px-big); color: var(--yel); }
.contact p { margin: 0 0 16px; color: var(--gray); }
.contact a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border: 2px solid var(--white); text-decoration: none; }
.contact a:hover, .contact a:focus-visible { background: var(--white); color: var(--plastic); outline: none; }
.contact small { display: block; margin-top: 10px; color: var(--gray); }
.demo { position: absolute; right: 22px; top: 52px; z-index: 3; color: var(--red); font-size: 12px; animation: blink 1s steps(1) infinite; }
.demo[hidden] { display: none; }

/* control panel */
.panel {
  position: relative; height: 128px; background: linear-gradient(180deg, #2a2420, var(--plastic));
  border-radius: 0 0 6px 6px; clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
  display: flex; align-items: center; justify-content: center; gap: 70px; padding: 0 40px;
  box-shadow: inset 0 3px 0 #3d342c;
}
.stick { position: relative; width: 96px; height: 96px; }
.stick__base { position: absolute; inset: 22px; border-radius: 50%; background: #0c0b0a; box-shadow: inset 0 3px 6px #000, 0 1px 0 #4a3f35; }
.stick__ball {
  position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -34px 0 0 -19px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9a8a, var(--red) 45%, #a3160e);
  box-shadow: 0 6px 0 -2px #0005; transition: transform .08s; pointer-events: none;
}
.stick__ball::after { content: ""; position: absolute; left: 50%; top: 32px; width: 8px; height: 22px; margin-left: -4px; background: #bbb; z-index: -1; border-radius: 3px; }
.stick button { position: absolute; width: 34px; height: 34px; background: none; border: 0; cursor: pointer; padding: 0; }
.stick .u { left: 31px; top: 0; } .stick .d { left: 31px; bottom: 0; } .stick .l { left: 0; top: 31px; } .stick .r { right: 0; top: 31px; }
.btns { display: flex; gap: 22px; align-items: center; }
.pbtn { display: grid; justify-items: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 0; font-size: 11px; color: var(--gray); }
.pbtn i {
  width: 52px; height: 52px; border-radius: 50%; display: block;
  background: radial-gradient(circle at 40% 35%, #fff6, transparent 45%), var(--c, var(--red));
  box-shadow: 0 6px 0 var(--d, #8f150e), 0 8px 10px #0008; transition: transform .06s, box-shadow .06s;
}
.pbtn.is-down i, .pbtn:active i { transform: translateY(5px); box-shadow: 0 1px 0 var(--d, #8f150e), 0 2px 4px #0008; }
.pbtn--b i { --c: var(--yel); --d: #a87b0b; }
.slot { display: grid; justify-items: center; gap: 6px; background: none; border: 0; cursor: pointer; font-size: 11px; color: var(--gray); position: relative; }
.slot__plate { width: 48px; height: 64px; border-radius: 4px; background: linear-gradient(180deg, #4b4038, #2c2520); display: grid; place-items: center; box-shadow: inset 0 0 0 2px #5c4f44; }
.slot__plate span { width: 6px; height: 34px; background: #000; border-radius: 3px; box-shadow: 0 0 6px var(--red); }
.coin { position: absolute; left: 50%; top: -40px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7c2, var(--yel) 50%, #b98a0e); opacity: 0; pointer-events: none; }
.coin.is-drop { animation: coin .55s cubic-bezier(.5, 0, .9, .5) forwards; }
@keyframes coin { 0% { opacity: 1; transform: translateY(0) scaleX(1); } 70% { opacity: 1; transform: translateY(56px) scaleX(.25); } 100% { opacity: 0; transform: translateY(66px) scaleX(.2); } }

.foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; padding: 16px 0 22px; color: var(--plastic); font-size: 13px; }
.foot a { text-decoration: none; background: var(--plastic); color: var(--yel); padding: 4px 10px; }
.foot a:hover { background: var(--white); color: var(--plastic); }

@media (max-width: 860px) {
  .cabinet { padding: 0; }
  .marquee { height: 58px; border-radius: 0; }
  .marquee h1 { font-size: 20px; }
  .marquee p { font-size: 11px; }
  .bezel { padding: 10px; }
  .screen { min-height: 0; padding: 12px; gap: 12px; border-radius: 12px; }
  .main { grid-template-columns: 1fr; gap: 16px; }
  .preview { grid-template-columns: 42% 1fr; grid-template-rows: auto; align-items: start; gap: 4px 12px; }
  .preview__monitor { grid-row: 1 / span 3; }
  .preview h2 { font-size: 18px; }
  .stats { font-size: 12px; grid-template-columns: 34px 1fr; }
  .prompt { font-size: 12px; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .help { display: none; }
  .hud__msg { display: none; }
  .panel { height: 120px; gap: 16px; padding: 0 14px; clip-path: none; border-radius: 0; justify-content: space-between; }
  .btns { gap: 14px; }
  .cabinet { overflow-x: hidden; }
  .overlay__big { font-size: 42px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .screen.is-booting > * { visibility: visible; }
}
</style>
</head>
<body>
<div class="cabinet">
  <header class="marquee is-booting" id="marquee">
    <div class="marquee__glass">
      <h1>ZANVIQ GALLERY</h1>
      <p id="marquee-sub"></p>
    </div>
  </header>

  <div class="bezel">
    <main class="screen is-booting" id="screen">
      <div>
        <div class="hud">
          <span class="hud__credit" id="credit">CREDIT 00</span>
          <span class="hud__msg">작품을 고르세요</span>
          <button class="sound" id="sound" type="button" aria-pressed="false">소리 끔</button>
        </div>
        <nav class="modes" id="modes" aria-label="태그로 거르기"></nav>
      </div>

      <div class="main">
        <section class="preview" aria-live="polite">
          <div class="preview__monitor"><span class="preview__tag" id="p-ext" hidden>외부 사이트</span><canvas id="p-canvas" width="480" height="360" role="img" aria-label=""></canvas></div>
          <h2 id="p-title"></h2>
          <div>
            <dl class="stats">
              <dt>종류</dt><dd id="p-kind"></dd>
              <dt>연도</dt><dd id="p-year"></dd>
              <dt>태그</dt><dd id="p-tags"></dd>
            </dl>
            <p class="prompt" id="p-prompt"></p>
          </div>
        </section>
        <ul class="grid" id="grid" aria-label="작품 선택"></ul>
      </div>

      <div class="help">
        <span><b>방향키</b> 이동</span><span><b>ENTER</b> 입장</span><span><b>Q E</b> 분류 바꾸기</span><span><b>C</b> 문의</span>
        <button class="coin-btn" id="coin-text" type="button">INSERT COIN 홈페이지 제작 문의</button>
      </div>

      <p class="demo" id="demo" hidden>DEMO</p>

      <div class="overlay" id="ready" hidden><div><div class="overlay__big" id="ready-big">READY</div><div class="overlay__small" id="ready-small"></div></div></div>
      <div class="overlay" id="contact" hidden role="dialog" aria-modal="true" aria-labelledby="c-title">
        <div class="contact">
          <h2 id="c-title">CONTINUE?</h2>
          <p>홈페이지 제작 문의는 아래로 받습니다. 소개용 사이트, 랜딩 페이지, 작은 웹 게임.</p>
          <a id="c-mail" href="#"><span>이메일</span><span id="c-mail-txt"></span></a>
          <a id="c-kakao" href="#" data-contact="kakao" target="_blank" rel="noopener"><span>카카오톡 오픈채팅</span><span>open.kakao.com</span></a>
          <small>ESC 또는 B 버튼으로 닫기</small>
        </div>
      </div>
    </main>
  </div>

  <div class="panel" aria-label="조작판">
    <div class="stick" id="stick">
      <div class="stick__base"></div>
      <div class="stick__ball" id="ball"></div>
      <button class="u" type="button" data-dir="up" aria-label="위"></button>
      <button class="d" type="button" data-dir="down" aria-label="아래"></button>
      <button class="l" type="button" data-dir="left" aria-label="왼쪽"></button>
      <button class="r" type="button" data-dir="right" aria-label="오른쪽"></button>
    </div>
    <div class="btns">
      <button class="pbtn" id="btn-a" type="button"><i></i>A 입장</button>
      <button class="pbtn pbtn--b" id="btn-b" type="button"><i></i>B 분류</button>
    </div>
    <button class="slot" id="slot" type="button"><span class="coin" id="coin"></span><span class="slot__plate"><span></span></span>문의</button>
  </div>

  <footer class="foot">
    <span>홈페이지 제작 문의</span>
    <a id="mail" href="#"></a>
    <a id="kakao" href="#" data-contact="kakao" target="_blank" rel="noopener">카카오톡 오픈채팅</a>
  </footer>
</div>

<script src="../_shared/works.sample.js"></script>
<script>
(function () {
  var G = window.GALLERY_SAMPLE;
  var works = G.works;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), canvas = $('p-canvas'), ctx = canvas.getContext('2d');
  var tags = ['all'].concat(G.tags());
  var mode = 0, list = [], sel = 0, busy = false;
  var imgs = {};

  /* ---------- contact ---------- */
  [$('mail'), $('c-mail')].forEach(function (a) { a.href = 'mailto:' + G.contact.email; });
  $('mail').textContent = G.contact.email;
  $('c-mail-txt').textContent = G.contact.email;
  $('kakao').href = $('c-kakao').href = G.contact.kakao;
  $('marquee-sub').innerHTML = '작품 ' + works.length + '<br>2025-2026';

  /* ---------- sound (off by default) ---------- */
  var ac = null, soundOn = false;
  function beep(f1, f2, dur, type) {
    if (!soundOn) return;
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  $('sound').addEventListener('click', function () {
    soundOn = !soundOn;
    this.setAttribute('aria-pressed', soundOn);
    this.textContent = soundOn ? '소리 켬' : '소리 끔';
    beep(660, 990, 0.08);
  });

  /* ---------- images ---------- */
  function load(w) {
    if (imgs[w.slug]) return imgs[w.slug];
    var im = new Image();
    im.decoding = 'async';
    im.src = G.thumb(w);
    imgs[w.slug] = im;
    return im;
  }
  function whenLoaded(im, fn) { if (im.complete && im.naturalWidth) fn(); else im.addEventListener('load', fn, { once: true }); }

  /* ---------- modes (tags) ---------- */
  var modesEl = $('modes');
  modesEl.innerHTML = '<span class="modes__key" aria-hidden="true">Q</span>' + tags.map(function (t, i) {
    return '<button class="mode" type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + (t === 'all' ? '전체' : G.label(t)) + '</button>';
  }).join('') + '<span class="modes__key" aria-hidden="true">E</span>';
  modesEl.addEventListener('click', function (e) {
    var b = e.target.closest('.mode');
    if (b) setMode(+b.dataset.i);
  });
  function setMode(i) {
    mode = (i + tags.length) % tags.length;
    modesEl.querySelectorAll('.mode').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.i === mode); });
    var cur = modesEl.querySelector('[data-i="' + mode + '"]');
    cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    beep(440, 330, 0.07);
    renderGrid();
  }

  /* ---------- grid ---------- */
  function kind(w) { return w.type === 'external' ? '외부 사이트' : (w.tags.indexOf('game') > -1 ? '게임' : '페이지'); }
  function renderGrid() {
    var t = tags[mode];
    list = works.filter(function (w) { return t === 'all' || w.tags.indexOf(t) > -1; });
    grid.innerHTML = '';
    list.forEach(function (w, i) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'tile' + (reduce ? '' : ' is-in');
      a.href = G.href(w);
      a.dataset.work = w.slug;
      a.dataset.i = i;
      a.tabIndex = -1;
      if (w.type === 'external') { a.target = '_blank'; a.rel = 'noopener'; }
      a.setAttribute('aria-label', w.title + ', ' + w.year + ', ' + kind(w));
      a.style.animationDelay = (i * 35) + 'ms';
      var c = document.createElement('canvas');
      c.width = 24; c.height = 24;
      a.appendChild(c);
      a.insertAdjacentHTML('beforeend', '<span class="tile__no">' + String(works.indexOf(w) + 1).padStart(2, '0') + '</span>' +
        (w.type === 'external' ? '<span class="tile__ext">외부</span>' : ''));
      li.appendChild(a);
      grid.appendChild(li);
      var im = load(w);
      whenLoaded(im, function () {
        var x = c.getContext('2d');
        // crop the 4:3 thumbnail to a square, keep the centre
        x.drawImage(im, 120, 0, 720, 720, 0, 0, 24, 24);
      });
    });
    if (!list.length) grid.innerHTML = '<li class="empty">이 분류에는 아직 작품이 없습니다.</li>';
    select(0, true);
  }

  function cols() { return getComputedStyle(grid).gridTemplateColumns.split(' ').length; }

  function select(i, silent) {
    if (!list.length) return;
    sel = Math.max(0, Math.min(list.length - 1, i));
    var tiles = grid.querySelectorAll('.tile');
    tiles.forEach(function (t, k) {
      t.classList.toggle('is-sel', k === sel);
      t.tabIndex = k === sel ? 0 : -1;
    });
    var w = list[sel];
    $('p-title').textContent = w.title;
    $('p-kind').textContent = kind(w);
    $('p-year').textContent = w.year;
    $('p-tags').textContent = w.tags.map(G.label).join(', ');
    $('p-ext').hidden = w.type !== 'external';
    $('p-prompt').textContent = w.type === 'external' ? 'A 버튼: 새 탭에서 ' + G.host(w) : (w.tags.indexOf('game') > -1 ? 'A 버튼으로 시작' : 'A 버튼으로 입장');
    canvas.setAttribute('aria-label', w.title + ' 미리보기');
    mosaic(w);
    if (!silent) beep(880, null, 0.04);
  }

  /* preview: blocks resolve into the picture */
  var mosaicRun = 0;
  function mosaic(w) {
    var run = ++mosaicRun;
    var im = load(w);
    whenLoaded(im, function () {
      if (run !== mosaicRun) return;
      var steps = reduce ? [0] : [6, 12, 24, 48, 0];
      var k = 0;
      (function next() {
        if (run !== mosaicRun) return;
        var s = steps[k++];
        ctx.imageSmoothingEnabled = !s;
        if (!s) { ctx.drawImage(im, 0, 0, 480, 360); return; }
        var sw = s, sh = Math.round(s * 0.75);
        var tmp = mosaic.tmp || (mosaic.tmp = document.createElement('canvas'));
        tmp.width = sw; tmp.height = sh;
        tmp.getContext('2d').drawImage(im, 0, 0, sw, sh);
        ctx.drawImage(tmp, 0, 0, sw, sh, 0, 0, 480, 360);
        setTimeout(next, 55);
      })();
    });
  }

  /* ---------- moving + confirming ---------- */
  function move(dir) {
    if (busy || !list.length) return;
    var c = cols();
    var i = sel;
    if (dir === 'left') i = sel - 1;
    if (dir === 'right') i = sel + 1;
    if (dir === 'up') i = sel - c;
    if (dir === 'down') i = sel + c;
    if (i < 0 || i >= list.length) { beep(160, null, 0.06, 'sawtooth'); return; }
    select(i);
    focusSel();
    tiltStick(dir);
  }
  function focusSel() {
    var t = grid.querySelectorAll('.tile')[sel];
    if (t && grid.contains(document.activeElement)) t.focus({ preventScroll: true });
  }
  function tiltStick(dir) {
    var m = { up: 'translate(0,-6px) rotateX(18deg)', down: 'translate(0,6px)', left: 'translate(-7px,0)', right: 'translate(7px,0)' };
    var b = $('ball');
    b.style.transform = m[dir] || '';
    clearTimeout(tiltStick.t);
    tiltStick.t = setTimeout(function () { b.style.transform = ''; }, 140);
  }
  function confirm() {
    if (busy || !list.length) return;
    var w = list[sel];
    var tile = grid.querySelectorAll('.tile')[sel];
    press($('btn-a'));
    beep(523, 1568, 0.25, 'square');
    if (reduce) return G.open(w);
    busy = true;
    tile.classList.add('is-confirm');
    setTimeout(function () {
      $('ready-big').textContent = w.tags.indexOf('game') > -1 ? 'READY' : (w.type === 'external' ? 'EXIT' : 'ENTER');
      $('ready-small').textContent = w.title;
      $('ready').hidden = false;
    }, 420);
    setTimeout(function () {
      $('ready').hidden = true;
      tile.classList.remove('is-confirm');
      busy = false;
      G.open(w);
    }, 1250);
  }
  function press(b) { b.classList.add('is-down'); setTimeout(function () { b.classList.remove('is-down'); }, 120); }

  grid.addEventListener('pointerover', function (e) {
    var t = e.target.closest('.tile');
    if (!t || e.pointerType !== 'mouse' || busy) return;
    if (+t.dataset.i !== sel) select(+t.dataset.i);
  });
  grid.addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (!t) return;
    e.preventDefault();
    var i = +t.dataset.i;
    if (i !== sel) { select(i); return; } // touch: first tap selects
    confirm();
  });

  /* ---------- contact (insert coin) ---------- */
  var credits = 0, lastFocus = null;
  function insertCoin() {
    var coin = $('coin');
    coin.classList.remove('is-drop');
    void coin.offsetWidth;
    if (!reduce) coin.classList.add('is-drop');
    beep(988, 1319, 0.12);
    setTimeout(function () {
      credits = Math.min(99, credits + 1);
      $('credit').textContent = 'CREDIT ' + String(credits).padStart(2, '0');
      lastFocus = document.activeElement;
      $('contact').hidden = false;
      $('c-mail').focus();
    }, reduce ? 0 : 420);
  }
  function closeContact() {
    if ($('contact').hidden) return false;
    $('contact').hidden = true;
    if (lastFocus) lastFocus.focus();
    return true;
  }
  $('slot').addEventListener('click', insertCoin);
  $('coin-text').addEventListener('click', insertCoin);
  $('contact').addEventListener('click', function (e) { if (e.target === this) closeContact(); });

  /* ---------- controls ---------- */
  document.querySelectorAll('.stick button').forEach(function (b) {
    b.addEventListener('click', function () { wake(); move(b.dataset.dir); });
  });
  $('btn-a').addEventListener('click', function () { wake(); if (!$('contact').hidden) return; confirm(); });
  $('btn-b').addEventListener('click', function () { wake(); press(this); if (!closeContact()) setMode(mode + 1); });

  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  addEventListener('keydown', function (e) {
    wake();
    var contactOpen = !$('contact').hidden;
    if (e.key === 'Escape' || (contactOpen && (e.key === 'x' || e.key === 'b'))) { closeContact(); return; }
    if (contactOpen) return;
    if (e.target.closest('.modes, .sound, .foot, .help') && (e.key === 'Enter' || e.key === ' ')) return;
    var dir = KEYS[e.key] || KEYS[e.key.toLowerCase && e.key.toLowerCase()];
    if (dir) { e.preventDefault(); move(dir); return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'z') { e.preventDefault(); confirm(); return; }
    if (e.key === 'q') setMode(mode - 1);
    if (e.key === 'e') setMode(mode + 1);
    if (e.key === 'c') insertCoin();
  });

  /* ---------- attract mode after 14s idle ---------- */
  var idleT = null, demoT = null;
  function wake() {
    clearTimeout(idleT);
    if (demoT) { clearInterval(demoT); demoT = null; $('demo').hidden = true; }
    if (!reduce) idleT = setTimeout(startDemo, 14000);
  }
  function startDemo() {
    if (busy || !$('contact').hidden) return wake();
    $('demo').hidden = false;
    demoT = setInterval(function () {
      var dirs = ['left', 'right', 'up', 'down'];
      var d = dirs[Math.floor(Math.random() * 4)];
      var c = cols(), i = sel + (d === 'left' ? -1 : d === 'right' ? 1 : d === 'up' ? -c : c);
      if (i >= 0 && i < list.length) { select(i, true); tiltStick(d); }
    }, 1500);
  }
  ['pointermove', 'pointerdown', 'wheel', 'touchstart'].forEach(function (ev) { addEventListener(ev, wake, { passive: true }); });

  /* ---------- boot ---------- */
  renderGrid();
  var screen = $('screen'), marquee = $('marquee');
  if (reduce) { screen.classList.remove('is-booting'); marquee.classList.remove('is-booting'); }
  else setTimeout(function () { screen.classList.remove('is-booting'); }, 850);
  setTimeout(function () { marquee.classList.remove('is-booting'); }, 1100);
  wake();
})();
</script>
</body>
</html>

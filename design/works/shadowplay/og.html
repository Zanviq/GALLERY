<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>shadowplay key visual (og/shadowplay.png)</title>
<!-- Dev-only: renders the 1200x630 key visual with the site's own puppet geometry and the same
     projection + stepped penumbra as the page. Capture with scripts/cdp.mjs at 1200x630. -->
<style>
  @font-face { font-family: "Moirai One"; src: url("/works/shadowplay/fonts/moirai-one.woff2") format("woff2"); }
  @font-face { font-family: "Gamja Flower"; src: url("/works/shadowplay/fonts/gamja-flower.woff2") format("woff2"); }
  html, body { margin: 0; background: #10335A; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script type="module">
import { SHAPE } from '/works/shadowplay/js/puppets.js';
const BLUE = '#10335A', WHITE = '#FFFFFF', T06 = '#1E3F64', T30 = '#58708C', T60 = '#9FADBD';
const HAND = '"Gamja Flower", sans-serif';
await document.fonts.load('64px "Moirai One"');
await document.fonts.load('24px "Gamja Flower"');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const s = 6, SX = 64, SY = 214;                 // screen origin (left, top) in px, 6 px per cm
const X = (x) => SX + x * s;
const EY = (y) => SY + (60 - y) * s;
const PZ = (z) => 176 - z * s;                   // plan: screen line at y = 176

const L = { x: 66, y: 11, z: 20 };
const P = [
  { id: 'fox', x: 62, y: 14.6, z: 14, flip: 1 },
  { id: 'bearer', x: 98, y: 20, z: 4, flip: -1 },
  { id: 'moon', x: 100, y: 42, z: 3, flip: 1 },
];
const rings = (p) => {
  const out = SHAPE[p.id].rings.map((r) => {
    let pts = r.pts.map(([x, y]) => [p.x + x * p.flip, p.y + y]);
    if (p.flip < 0) pts = pts.reverse();
    return pts;
  });
  out.push([[p.x - 0.25, -16], [p.x + 0.25, -16], [p.x + 0.25, p.y], [p.x - 0.25, p.y]]);
  return out;
};

ctx.fillStyle = BLUE; ctx.fillRect(0, 0, 1200, 630);
// sheet border (double)
ctx.strokeStyle = WHITE; ctx.lineWidth = 1.2;
ctx.strokeRect(14.5, 14.5, 1171, 601); ctx.strokeRect(18.5, 18.5, 1163, 593);

// ---- plan strip
ctx.fillStyle = T06; ctx.fillRect(X(-6), PZ(14), 132 * s, 11 * s);
ctx.strokeStyle = T30; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(X(-6), PZ(14)); ctx.lineTo(X(126), PZ(14)); ctx.moveTo(X(-6), PZ(3)); ctx.lineTo(X(126), PZ(3)); ctx.stroke();
ctx.strokeStyle = WHITE; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(X(0), PZ(0)); ctx.lineTo(X(120), PZ(0)); ctx.stroke();
const dash = (x0, y0, x1, y1, col, d = [5, 4], w = 1) => {
  ctx.setLineDash(d); ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
};
// rays past the fox's edges, its footprint, drop lines
const fox = P[0];
const xs = rings(fox).slice(0, -1).flat().map((q) => q[0]);
const a = Math.min(...xs), b = Math.max(...xs);
const k = L.z / (L.z - fox.z);
const fa = Math.max(0, L.x + k * (a - L.x)), fb = Math.min(120, L.x + k * (b - L.x));
dash(X(L.x), PZ(L.z), X(L.x + k * (a - L.x)), PZ(0), T60);
dash(X(L.x), PZ(L.z), X(L.x + k * (b - L.x)), PZ(0), T60);
dash(X(L.x), PZ(L.z), X(0), PZ(0), T30, [3, 5]);
dash(X(L.x), PZ(L.z), X(120), PZ(0), T30, [3, 5]);
ctx.strokeStyle = T60; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(X(fa), PZ(0) + 4); ctx.lineTo(X(fb), PZ(0) + 4); ctx.stroke();
dash(X(fa), PZ(0) + 6, X(fa), SY - 10, T30, [2, 4]);
dash(X(fb), PZ(0) + 6, X(fb), SY - 10, T30, [2, 4]);
// puppets seen from above
for (const p of P) {
  const px = rings(p).slice(0, -1).flat().map((q) => q[0]);
  ctx.strokeStyle = WHITE; ctx.lineWidth = p === fox ? 4 : 2.4;
  ctx.beginPath(); ctx.moveTo(X(Math.min(...px)), PZ(p.z)); ctx.lineTo(X(Math.max(...px)), PZ(p.z)); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(p.x), PZ(p.z), 4, 0, Math.PI * 2); ctx.fillStyle = BLUE; ctx.fill(); ctx.lineWidth = 1.4; ctx.stroke();
}
// lamp symbol
{
  const cx = X(L.x), cy = PZ(L.z), r = 11;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = BLUE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.stroke();
  const d = r * 0.7071;
  ctx.beginPath(); ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx + d, cy + d); ctx.moveTo(cx + d, cy - d); ctx.lineTo(cx - d, cy + d); ctx.lineWidth = 1.8; ctx.stroke();
  ctx.font = `22px ${HAND}`; ctx.fillStyle = WHITE; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('빛', cx - r - 8, cy + 1);
}

// ---- elevation: frame, posts, paper, shadows
ctx.strokeStyle = WHITE; ctx.lineWidth = 1.5;
ctx.strokeRect(X(-1.4), EY(61.4), 122.8 * s, 61.4 * s);
ctx.fillStyle = WHITE; ctx.fillRect(X(0), EY(60), 120 * s, 60 * s);
const m = document.createElement('canvas'); m.width = 120 * s * 2; m.height = 60 * s * 2;
const mc = m.getContext('2d'); const sc = s * 2;
mc.globalCompositeOperation = 'lighter';
const kmax = Math.max(...P.map((p) => L.z / (L.z - p.z)));
const n = 16, R = 1.1;
mc.fillStyle = `rgba(255,255,255,${1 / n})`;
for (let i = 0; i < n; i++) {
  const rr = Math.sqrt((i + 0.5) / n), t = i * 2.399963;
  const lx = L.x + rr * Math.cos(t) * R, ly = L.y + rr * Math.sin(t) * R;
  mc.beginPath();
  for (const p of P) {
    const kk = L.z / (L.z - p.z);
    for (const ring of rings(p)) {
      ring.forEach(([x, y], j) => {
        const X2 = (lx + kk * (x - lx)) * sc, Y2 = (60 - (ly + kk * (y - ly))) * sc;
        j ? mc.lineTo(X2, Y2) : mc.moveTo(X2, Y2);
      });
      mc.closePath();
    }
  }
  mc.fill('nonzero');
}
mc.globalCompositeOperation = 'source-in'; mc.fillStyle = BLUE; mc.fillRect(0, 0, m.width, m.height);
ctx.drawImage(m, X(0), EY(60), 120 * s, 60 * s);
// floor
ctx.strokeStyle = WHITE; ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(X(-6), EY(-5)); ctx.lineTo(X(126), EY(-5)); ctx.stroke();
ctx.strokeStyle = T30; ctx.lineWidth = 1; ctx.beginPath();
for (let x = X(-5); x < X(126); x += 7) { ctx.moveTo(x, EY(-5)); ctx.lineTo(x - 5, EY(-5) + 5); }
ctx.stroke();
for (const xx of [X(-1.4), X(120)]) {
  ctx.save(); ctx.beginPath(); ctx.rect(xx, EY(0), 1.4 * s, 5 * s); ctx.clip();
  ctx.strokeStyle = T30; ctx.beginPath();
  for (let y = EY(0) - 20; y < EY(-5) + 20; y += 4) { ctx.moveTo(xx, y + 9); ctx.lineTo(xx + 9, y); }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.2; ctx.strokeRect(xx, EY(0), 1.4 * s, 5 * s);
}

// ---- title block
const TX = 862, TW = 296;
ctx.strokeStyle = WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(TX, 214, TW, 360);
ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(TX, 454); ctx.lineTo(TX + TW, 454); ctx.moveTo(TX, 514); ctx.lineTo(TX + TW, 514); ctx.stroke();
ctx.fillStyle = WHITE; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
ctx.font = '70px "Moirai One"';
ctx.fillText('집채만 한', TX + 22, 318);
ctx.fillText('그림자', TX + 22, 408);
ctx.font = `26px ${HAND}`;
ctx.fillText('종이 그림자극 무대', TX + 22, 493);
ctx.fillStyle = T60; ctx.font = `22px ${HAND}`;
ctx.fillText('zanviq gallery', TX + 22, 552);
document.title = 'ready';
</script>
</body>
</html>

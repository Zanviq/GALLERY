<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>idphoto og (dev)</title>
<link rel="stylesheet" href="../../../works/idphoto/css/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #B9D3EA; color: #101214; position: relative; font-family: 'Jeongmyeon Sans', sans-serif; }
  .word { position: absolute; left: 64px; top: 44px; font: 400 150px/1 'Song Myung'; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 68px; top: 248px; width: 420px; font: 500 27px/1.55 'Jeongmyeon Sans'; }
  .small { position: absolute; left: 68px; top: 470px; width: 400px; padding-top: 16px; border-top: 3px solid #101214; font: 500 21px/1.5 'Jeongmyeon Sans'; }
  .sheet { position: absolute; left: 576px; top: 226px; width: 564px; aspect-ratio: 152.4 / 101.6; background: #fff;
    box-shadow: 0 1px 2px rgb(16 18 20 / .2), 0 18px 40px -22px rgb(16 18 20 / .5); }
  .cuts { position: absolute; left: 4.068%; top: 5.709%; width: 91.864%; height: 88.583%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
  .cuts img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .trim i { position: absolute; }
  .trim .h { left: 0; right: 0; border-top: 1px dashed rgb(16 18 20 / .5); }
  .trim .v { top: 0; bottom: 0; border-left: 1px dashed rgb(16 18 20 / .5); }
</style>
</head>
<body>
<div class="word">정면사진관</div>
<div class="sub">여권, 주민등록증, 운전면허,<br>비자, 취업용 반명함.<br>앉아서 5분, 손에 쥐기까지 15분.</div>
<div class="small">규격마다 다르게 잽니다.</div>
<div class="sheet">
  <div class="cuts" id="cuts"></div>
  <div class="trim">
    <i class="h" style="top:5.709%"></i><i class="h" style="top:50%"></i><i class="h" style="top:94.291%"></i>
    <i class="v" style="left:4.068%"></i><i class="v" style="left:27.034%"></i><i class="v" style="left:50%"></i><i class="v" style="left:72.966%"></i><i class="v" style="left:95.932%"></i>
  </div>
</div>
<script>
  const cuts = document.getElementById('cuts');
  for (let i = 0; i < 8; i++) { const im = new Image(); im.src = '../../../works/idphoto/img/license-400.webp'; im.alt = ''; cuts.append(im); }
  Promise.all([document.fonts.ready, ...[...cuts.querySelectorAll('img')].map((i) => i.decode())]).then(() => document.body.setAttribute('data-ready', ''));
</script>
</body>
</html>

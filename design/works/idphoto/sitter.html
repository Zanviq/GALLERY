<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>sitter preview (dev)</title>
<style>
  body { margin: 0; background: #888; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  svg { width: 300px; height: 380px; display: block; }
  .b { background: #B9D3EA; } .w { background: #fff; }
</style>
</head>
<body>
<script type="module">
  import { SITTERS, shapes, toSVG } from '../../../works/idphoto/js/sitter.js';
  const add = (sp, opts, bg) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('viewBox', '-120 -30 240 304');
    el.setAttribute('class', bg);
    el.innerHTML = toSVG(shapes(sp, opts));
    document.body.append(el);
  };
  const v = new URLSearchParams(location.search).get('v');
  if (v === 'variants') {
    add(SITTERS[0], { outfit: 'shirt' }, 'w');
    add(SITTERS[1], { fringe: 'heavy' }, 'b');
    add(SITTERS[1], { fringe: 'pinned' }, 'b');
    add(SITTERS[2], { glasses: 'glare' }, 'w');
    add(SITTERS[1], { ears: 'covered' }, 'b');
    add(SITTERS[0], { smile: 'teeth' }, 'b');
    add(SITTERS[0], { fringe: 'heavy' }, 'b');
  } else {
    SITTERS.forEach((s, i) => add(s, {}, i === 1 ? 'w' : 'b'));
  }
</script>
</body>
</html>

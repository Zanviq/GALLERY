<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점멸 frames (review sheet, not deployed)</title>
<link rel="stylesheet" href="../../../works/cinema/css/fonts.css">
<style>
  body { margin: 0; background: #000; color: #9a9a9a; font: 12px/1.4 'Jeommyeol Sans', sans-serif; }
  .g { display: grid; grid-template-columns: repeat(4, 360px); gap: 10px; padding: 10px; }
  canvas { display: block; width: 360px; height: 240px; }
</style>
</head>
<body>
<div class="g" id="g"></div>
<script type="module">
  import { renderFrame } from '../../../works/cinema/js/frames.js';
  const only = new URLSearchParams(location.search).get('n');
  const list = only ? only.split(',').map(Number) : Array.from({ length: 36 }, (_, i) => i + 1);
  await document.fonts.load("400 64px 'Diphylleia'", '점멸');
  await document.fonts.load("700 19px 'Jeommyeol Sans'", '12월 2일 개봉 소리개고개');
  for (const n of list) {
    const d = document.createElement('div');
    const c = document.createElement('canvas');
    c.width = 720; c.height = 480;
    d.append(c, n);
    document.getElementById('g').append(d);
    renderFrame(c, n);
  }
  document.body.dataset.done = '1';
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점멸 OG card (source for og/cinema.png, not deployed)</title>
<link rel="stylesheet" href="../../../works/cinema/css/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; color: #fff; }
  .art { position: absolute; right: 0; top: 0; width: 470px; height: 630px; overflow: hidden; }
  .art img { position: absolute; left: 0; top: -60px; width: 470px; height: auto; display: block; }
  .art::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to right, #000 0, rgba(0, 0, 0, 0) 22%), linear-gradient(to top, #000 0, rgba(0, 0, 0, 0) 18%);
  }
  .title { position: absolute; left: 72px; top: 40px; margin: 0; font: 400 236px/1.1 'Diphylleia', serif; letter-spacing: 0.04em; }
  .tag { position: absolute; left: 80px; top: 330px; margin: 0; font: 400 34px/1.5 'Diphylleia', serif; }
  .meta { position: absolute; left: 80px; bottom: 60px; margin: 0; font: 400 22px/1.6 'Jeommyeol Sans', sans-serif; color: #cfcfcf; }
  .meta b { display: block; color: #fff; font: 400 40px/1.3 'Diphylleia', serif; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="art"><img src="../../../works/cinema/img/poster-lit-1200.webp" alt=""></div>
  <h1 class="title">점멸</h1>
  <p class="tag">불이 두 번 켜지면<br>잘 있다는 뜻이었다</p>
  <p class="meta"><b>12월 2일 개봉</b>여은솔 감독 · 낮은창필름</p>
</div>
<script>
  Promise.all([
    document.fonts.load("400 236px 'Diphylleia'", '점멸 불이 두 번 켜지면 잘 있다는 뜻이었다 12월 2일 개봉'),
    document.fonts.load("400 22px 'Jeommyeol Sans'", '여은솔 감독 · 낮은창필름'),
    document.querySelector('img').decode(),
  ]).then(() => { document.body.dataset.done = '1'; });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점멸 OG card (source for og/cinema.png, not deployed)</title>
<link rel="stylesheet" href="../../../works/cinema/css/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; color: #fff; }
  .pic { position: absolute; left: 56px; top: 56px; width: 777px; height: 518px; }
  .pic canvas { display: block; width: 777px; height: 518px; }
  .sub {
    position: absolute; left: 0; right: 0; bottom: 34px; margin: 0; text-align: center;
    color: #ffe13b; font: 700 30px/1.4 'Jeommyeol Sans', sans-serif; letter-spacing: -0.01em;
    text-shadow: 0 0 2px #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 4px #000;
  }
  .title {
    position: absolute; right: 70px; top: 36px; margin: 0;
    writing-mode: vertical-rl; font: 400 178px/1.15 'Diphylleia', serif; letter-spacing: 0.06em;
  }
  .meta { position: absolute; left: 881px; bottom: 56px; margin: 0; font: 400 21px/1.6 'Jeommyeol Sans', sans-serif; color: #cfcfcf; }
  .meta b { display: block; color: #fff; font: 400 34px/1.3 'Diphylleia', serif; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="pic"><canvas width="1554" height="1036"></canvas><p class="sub">잘 있다는 뜻이었대요.</p></div>
  <h1 class="title">점멸</h1>
  <p class="meta"><b>12월 2일 개봉</b>여은솔 감독<br>낮은창필름</p>
</div>
<script type="module">
  import { renderFrame } from '../../../works/cinema/js/frames.js';
  await document.fonts.load("400 196px 'Diphylleia'", '점멸 12월 2일 개봉');
  await document.fonts.load("700 30px 'Jeommyeol Sans'", '잘 있다는 뜻이었대요.');
  await document.fonts.load("400 21px 'Jeommyeol Sans'", '여은솔 감독 낮은창필름');
  renderFrame(document.querySelector('canvas'), 33, { lit: 1, flash: 0, grain: 0.24 });
  document.body.dataset.done = '1';
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>lostfound key visual / OG (dev only)</title>
<!-- Captured at 1200x630 for og/lostfound.png and keyvisual.png. Uses the game's own CSS, fonts and sketches. -->
<link rel="stylesheet" href="/works/lostfound/css/fonts.css">
<link rel="stylesheet" href="/works/lostfound/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { padding: 0; }
  .kv { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 470px 1fr; gap: 0; }
  .kv-text { padding: 70px 0 0 64px; display: grid; align-content: start; gap: 22px; }
  .kv-place { font: 30px/1.1 var(--ui); }
  .kv-name { font: 66px/1.08 var(--ui); }
  .kv-strip { justify-self: start; padding: 12px 20px 10px 18px; background: var(--tag); color: var(--marker); font: 34px/1.2 var(--hand); box-shadow: 0 2px 0 var(--drop); }
  .kv-meta { display: flex; gap: 12px; align-items: center; margin-top: 18px; font: 22px/1 var(--ui); }
  .kv-meta .locker-no { min-width: 52px; height: 52px; font-size: 28px; }
  .kv .board { margin: 48px 56px 48px 0; --gap: 104px; --tkw: 200px; grid-template-columns: minmax(0, 1fr) var(--gap) var(--tkw); align-content: center; row-gap: 14px; padding: 22px 22px 26px; }
  .kv .shelf { gap: 22px; }
  .kv .counter { justify-content: space-between; padding: 8px 0; }
  .kv .tag-desc { font-size: 26px; }
  .kv .tag-no { width: 32px; height: 32px; font-size: 26px; }
  .kv .eyelet { width: 18px; height: 18px; margin-top: -9px; right: 12px; }
  .kv .tag-paper { grid-template-columns: 84px minmax(0, 1fr); grid-template-areas: 'sk title' 'sk desc'; padding: 16px 48px 16px 16px; column-gap: 16px; }
  .kv .sketch { width: 84px; height: 63px; align-self: center; margin: 0; }
  .kv .tag-title { font-size: 38px; gap: 8px; }
  .kv .ticket { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: 'no name' 'state state'; column-gap: 12px; align-items: center; padding: 10px 12px 17px 26px; }
  .kv .tk-no { font-size: 46px; }
  .kv .tk-state { font-size: 26px; }
  .kv .tk-name { font-size: 20px; }
</style>
</head>
<body>
<div class="kv">
  <div class="kv-text">
    <p class="kv-place">갈래터미널 2층</p>
    <h1 class="kv-name">유실물<br>보관소</h1>
    <p class="kv-strip">꼬리표 끈을 주인에게 묶어 주세요.</p>
    <p class="kv-meta"><span class="locker-no">10</span>사건 열 개, 추리표와 힌트</p>
  </div>
  <section class="board is-solved-one" id="board">
    <ul class="shelf" id="shelf"></ul>
    <ul class="counter" id="counter"></ul>
    <svg class="strings" id="strings"></svg>
  </section>
</div>
<script type="module">
  import { sketchSVG } from '/works/lostfound/js/sketches.js';
  const items = [
    { id: 'a', no: 1, kind: '우산', sk: 'umbrella', desc: '남색 장우산', to: 'q', done: false },
    { id: 'b', no: 2, kind: '리코더', sk: 'recorder', desc: '하늘색 천 주머니', to: 'r', done: false },
    { id: 'c', no: 3, kind: '돋보기안경', sk: 'glasses', desc: '갈색 뿔테', to: 'p', done: true },
  ];
  const people = [{ id: 'p', no: 11, name: '문덕배 님', st: '받아 감' }, { id: 'q', no: 13, name: '서지안 님', st: '' }, { id: 'r', no: 12, name: '권해솔 님', st: '' }];
  document.getElementById('shelf').innerHTML = items.map((it) => `<li class="tag-li"><span class="tag" id="t-${it.id}"><span class="tag-paper"${it.done ? ' style="background:var(--glow)"' : ''}>${sketchSVG(it.sk)}<span class="tag-title"><span class="tag-no">${it.no}</span>${it.kind}</span><span class="tag-desc">${it.desc}</span></span><span class="eyelet"></span></span></li>`).join('');
  document.getElementById('counter').innerHTML = people.map((p) => `<li class="tk-li"><span class="ticket" id="k-${p.id}"><span class="clip"></span><span class="tk-no">${p.no}</span><span class="tk-name">${p.name}</span><span class="tk-state" style="color:var(--marker)">${p.st}</span></span></li>`).join('');
  const rope = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), s = Math.min(44, d * 0.15) + 3; return `M${x1} ${y1} C${x1 + dx * 0.33} ${y1 + dy * 0.33 + s} ${x1 + dx * 0.68} ${y1 + dy * 0.68 + s} ${x2} ${y2}`; };
  const draw = () => {
    const base = document.getElementById('board').getBoundingClientRect();
    const c = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2 - base.left, r.top + r.height / 2 - base.top]; };
    let out = '';
    for (const it of items) {
      const [x1, y1] = c(document.querySelector(`#t-${it.id} .eyelet`));
      const [x2, y2] = c(document.querySelector(`#k-${it.to} .clip`));
      const d = rope(x1, y1, x2, y2);
      out += `<path class="str-shadow" d="${d}"/><path class="str${it.done ? ' is-done' : ''}" d="${d}"/>`;
    }
    const svg = document.getElementById('strings');
    svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
    svg.innerHTML = out;
  };
  document.fonts.ready.then(draw);
</script>
</body>
</html>

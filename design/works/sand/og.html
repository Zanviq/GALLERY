<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>sand og</title>
<!-- Share image (1200x630) for og/sand.png, drawn with the page's own sand modules.
     Open at http://127.0.0.1:8000/design/works/sand/og.html and capture at 1200x630. -->
<link rel="stylesheet" href="../../../works/sand/css/fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 1200px; height: 630px; }</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script type="module">
import { Sand, CX, MOUTH, BOTTOM } from '../../../works/sand/js/sim.js';
import { buildLut } from '../../../works/sand/js/palette.js';
import { makeGridCanvas, paintGrid, drawBottle, drawCork, drawReflection } from '../../../works/sand/js/render.js';

const sim = new Sand(20261109);
const plan = [[3, 1.0, -6, 8], [2, 0.8, 26, 12], [1, 1.0, -28, -8], [5, 0.6, 4, 30], [4, 0.9, -18, 20],
  [3, 0.8, 30, -6], [2, 0.7, -30, -12], [1, 0.9, 6, 26], [5, 0.6, -24, 10], [4, 0.8, 22, -20], [3, 0.7, 0, 0]];
const jitter = () => (sim.rand() - 0.5) * 2.6;
for (const [c, amt, from, to] of plan) {
  const total = Math.round((sim.capacity / 14) * amt);
  for (let n = 0; n < 6; n++) { sim.setTilt(from + ((to - from) * n) / 5); sim.pourInstant(c, Math.round(total / 6), jitter); }
}
for (let n = 0; n < 12 && !sim.mouthBlocked(); n++) {
  const c = [2, 1, 5, 3, 4][n % 5];
  for (let j = 0; j < 6 && !sim.mouthBlocked(); j++) { sim.setTilt((n % 2 ? 1 : -1) * (24 - j * 8)); sim.pourInstant(c, Math.round(sim.capacity / 90), jitter); }
}
sim.setTilt(0); sim.settle();

const grid = makeGridCanvas();
paintGrid(grid, sim.g, buildLut());
const cv = document.getElementById('og');
const ctx = cv.getContext('2d');
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1200, 630);
const S = 2.62, ox = 360 - CX * S, oy = 40 - (MOUTH - 11) * S;
const shelf = oy + (BOTTOM + 2) * S;
ctx.fillStyle = '#fff';
ctx.fillRect(0, Math.round(shelf), 1200, 3);
ctx.setTransform(S, 0, 0, S, ox, oy);
drawReflection(ctx, grid.canvas, 18);
drawBottle(ctx, grid.canvas);
drawCork(ctx, 0);
ctx.setTransform(1, 0, 0, 1, 0, 0);

await document.fonts.load('120px "Black And White Picture"');
const F = '"Black And White Picture"';
ctx.fillStyle = '#fff';
ctx.textBaseline = 'alphabetic';
ctx.font = `128px ${F}`;
ctx.fillText('색모래 병', 650, 236);
ctx.font = `34px ${F}`;
ctx.fillText('모래를 골라 붓고,', 654, 318);
ctx.fillText('병을 기울여 물결을 만들어요.', 654, 366);
ctx.font = `26px ${F}`;
ctx.fillText('zanviq gallery', 654, shelf - 22);
document.body.dataset.ready = '1';
</script>
</body>
</html>

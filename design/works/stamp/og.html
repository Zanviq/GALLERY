<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>칼퇴 결재 OG</title>
<!-- Social preview and key visual, built from the game's own document and ink modules.
     Capture at 1200x630 (og/stamp.png) and 1600x840 (design/works/stamp/keyvisual.png). -->
<link rel="stylesheet" href="../../../works/stamp/css/fonts.css">
<link rel="stylesheet" href="../../../works/stamp/css/site.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: #FFFFFF; }
  .og { position: relative; width: 100vw; height: 100vh; display: grid; grid-template-columns: 37% 63%; }
  .left { padding: 7vh 0 6vh 6vw; display: flex; flex-direction: column; justify-content: center; gap: 2.4vh; }
  .og-title { font-family: var(--f-hand); font-size: 15vh; line-height: .9; transform: rotate(-2deg); transform-origin: left bottom; margin: 0; font-weight: 400; }
  .og-sub { font-size: 4.4vh; line-height: 1.25; margin: 0; }
  .og-co { font-size: 3.2vh; color: var(--carbon-soft); margin: 0; }
  .og-note { font-family: var(--f-hand); font-size: 5vh; line-height: 1.05; margin: 1vh 0 0; padding-left: 1.6vh; border-left: .5vh solid var(--carbon); }
  .right { position: relative; }
  .og-tray { position: absolute; left: 0; right: 0; top: 33%; height: 60%; background: var(--tray); box-shadow: inset 0 3px 0 var(--carbon-faint), inset 0 -3px 0 var(--carbon-faint); overflow: hidden; }
  .og-stamp { position: absolute; z-index: 3; }
  .og-stamp img { width: 100%; height: 100%; display: block; }
  .og .aim { position: absolute; top: 0; bottom: 0; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="left">
    <h1 class="og-title">칼퇴 결재</h1>
    <p class="og-sub">지나가는 결재 서류에<br>한 번에 꾹.</p>
    <p class="og-note">18시까지 75초, 트레이는 점점 빨라져요</p>
    <p class="og-co">(주)한칸물산 총무팀, 도장 타이밍 게임</p>
  </div>
  <div class="right" id="right">
    <div class="og-tray" id="tray"><div class="belt" id="belt"></div></div>
  </div>
</div>
<script type="module">
  import { buildDoc, paintDoc } from '../../../works/stamp/js/docs.js';
  import { makeImpression, rng } from '../../../works/stamp/js/ink.js';
  await document.fonts.ready;
  const tray = document.getElementById('tray');
  const belt = document.getElementById('belt');
  const H = tray.clientHeight;
  const dw = Math.floor((H - 24) / 1.3);
  const u = dw / 100;
  document.documentElement.style.setProperty('--u', u + 'px');
  const rand = rng(1109);
  const top = 12;
  const docs = [];
  function put(spec, x, rot) {
    const d = buildDoc(spec, rand, u);
    paintDoc(d, u);
    d.el.style.transform = `translate(${x}px, ${top}px) rotate(${rot}deg)`;
    belt.appendChild(d.el);
    docs.push(d);
    return d;
  }
  function stampOn(d, lx, seed, opts = {}) {
    const size = 15 * u;
    const { canvas, pad } = makeImpression({ size, dpr: 2, seed, press: 1.05, tilt: 0.6, tiltAngle: seed % 6, rot: 0.03, ...opts });
    const half = (size / 2 + pad) / u;
    const place = (sheet, c, seam) => {
      c.className = 'imp';
      if (seam != null) c.style.clipPath = `inset(0 0 0 ${Math.max(0, seam - (lx - half)).toFixed(2)}em)`;
      c.style.left = (lx - sheet.x0 - half) + 'em';
      c.style.top = (28 - half) + 'em';
      c.style.width = c.style.height = half * 2 + 'em';
      sheet.el.appendChild(c);
    };
    if (d.kind === 'ganin') {
      const copy = document.createElement('canvas');
      copy.width = canvas.width; copy.height = canvas.height;
      copy.getContext('2d').drawImage(canvas, 0, 0);
      place(d.sheets[1].x0 < 0 ? d.sheets[1] : d.sheets[0], canvas);
      place(d.sheets.find((s) => s.x0 === 0), copy, 68);
      d.el.classList.add('split');
    } else place(d.sheets[0], canvas);
  }
  const W = tray.clientWidth;
  const ax = Math.round(W * 0.04);
  const a = put({ kind: 'gyeoljae', boxes: [1] }, ax, -0.5);
  stampOn(a, 68, 31);
  const bx = ax + 100 * u + 22 + 32 * u;
  const b = put({ kind: 'ganin' }, bx, 0.3);
  stampOn(b, 68, 77, { smear: 3 });
  const aimX = bx + 68 * u;
  // the stamp, just lifted over the seam
  const s = document.createElement('div');
  s.className = 'og-stamp';
  const imp = 15 * u;
  s.style.cssText = `left:${aimX - imp / 2}px; top:${tray.offsetTop - imp * 3.34 - 14}px; width:${imp}px; height:${imp * 3.34}px`;
  const img = new Image();
  img.src = '../../../works/stamp/img/seal-240.webp';
  img.alt = '';
  s.appendChild(img);
  document.getElementById('right').appendChild(s);
  await img.decode();
  document.body.dataset.ready = '1';
</script>
</body>
</html>

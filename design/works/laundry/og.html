<!doctype html>
<!-- OG key visual for og/laundry.png (1200x630). Rendered by scripts/stills.mjs; not deployed. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/works/laundry/css/fonts.css">
<link rel="stylesheet" href="/works/laundry/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background-position: -1px -1px; }
  .og { position: relative; width: 1200px; height: 630px; }
  .og__words { position: absolute; left: 70px; top: 146px; width: 440px; }
  .og__mark { display: flex; align-items: center; gap: 22px; }
  .og__mark svg { width: 112px; height: 112px; }
  .og__name { font: 400 150px/0.9 var(--f-display); letter-spacing: 0; }
  .og__kind { margin-top: 26px; font: 800 38px/1.2 var(--f-body); }
  .og__line { margin-top: 18px; font: 700 26px/1.45 var(--f-body); color: var(--ink-2); }
  .og__note { position: absolute; left: 76px; bottom: 54px; font: 400 18px/1.4 var(--f-body); color: var(--ink-2); }
  .og__wall { position: absolute; right: 64px; top: 152px; display: grid; grid-template-columns: repeat(3, 196px); gap: 6px; }
  .og__wall .mc { padding: 10px 10px 28px; border-radius: 14px 14px 4px 4px; gap: 12px; }
  .og__wall .mc::after { height: 14px; }
  .og__wall .mc__top { padding: 7px 10px; border-radius: 8px; gap: 8px; }
  .og__wall .mc__num { font-size: 30px; }
  .og__wall .mc__led { width: 13px; height: 13px; }
  .og__wall .mc__seg { height: 30px; }
  .og__wall .mc__word { font-size: 22px; }
  .og__wall .mc__tag { font-size: 18px; margin-top: -8px; }
  .og__wall .mc__glass { box-shadow: inset 0 0 0 5px var(--graphite), inset 0 6px 12px rgb(31 36 40 / .45); }
  .og__wall .mc__load { animation: none !important; }
  .og__wall .mc[data-state="run"] .mc__load { transform: rotate(-24deg); }
</style>
</head>
<body>
<div class="og">
  <div class="og__words">
    <div class="og__mark">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" class="brand__ring"/>
        <circle cx="20" cy="20" r="13" class="brand__glass"/>
        <path d="M10.5 24.5c3-2.6 6.4-2.9 9.5-1.1 3 1.8 6.3 1.6 9.5-1" class="brand__wave"/>
        <path d="M13.2 14.6a8.6 8.6 0 0 1 6-3.9" class="brand__shine"/>
      </svg>
      <span class="og__name">뽀득</span>
    </div>
    <p class="og__kind">셀프 빨래방</p>
    <p class="og__line">가기 전에 빈 세탁기부터 보세요.<br>지점마다 남은 시간이 보여요.</p>
  </div>
  <p class="og__note">가상 빨래방입니다. zanviq gallery 작품.</p>
  <div class="og__wall" id="wall"></div>
</div>
<script type="module">
  import { seg } from '/works/laundry/js/seg.js';
  const RUN = '<svg class="mc__load" viewBox="-20 -20 40 40"><path d="M-11 3c3-4 9-5 12-1 2 3-1 7-6 7s-8-2-6-6z" class="ld-a"/><path d="M3 -12c4-2 9 0 9 4s-4 6-8 5-5-7-1-9z" class="ld-b"/><path d="M6 6c3 0 6 2 5 5s-6 3-8 1 0-6 3-6z" class="ld-c"/></svg>';
  const DONE = '<svg class="mc__load" viewBox="-20 -20 40 40"><path d="M-13 9c2-5 8-6 13-4s9 0 11 3c1 3-2 6-12 6s-13-1-12-5z" class="ld-a"/><path d="M-6 4c2-3 7-3 9 0 1 2-2 3-5 3s-5-1-4-3z" class="ld-b"/><path d="M5 6c3-2 7-1 7 1s-3 3-6 2-3-2-1-3z" class="ld-c"/></svg>';
  const M = [[4, 'free', ' --', '', '비어 있음'], [5, 'run', ' 12', RUN, '12분 남음'], [6, 'done', 'End', DONE, '끝남']];
  document.getElementById('wall').innerHTML = M.map(([n, st, s, load, word]) => `<div class="mc mc--washer" data-state="${st}">
    <span class="mc__top"><span class="mc__num">${n}</span><span class="mc__led"></span><span class="mc__seg">${seg(s)}</span></span>
    <span class="mc__door"><span class="mc__glass">${load}</span></span>
    <span class="mc__word">${word}</span><span class="mc__tag">20kg</span></div>`).join('');
  document.querySelectorAll('.mc__led').forEach((l) => { l.style.animation = 'none'; });
  window.ready = true;
</script>
</body>
</html>

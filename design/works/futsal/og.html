<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>늦깎이 FS OG card (dev, not deployed)</title>
<!-- Rendered to og/futsal.png at 1200x630 by scripts/render-images.sh. Uses the site's own fonts,
     colours and lead photo: the recruiting-poster type on the court blue, the huddle on the right. -->
<link rel="stylesheet" href="/works/futsal/css/fonts.css">
<link rel="stylesheet" href="/works/futsal/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--court); color: var(--white); }
  .card { display: grid; grid-template-columns: 600px 600px; width: 1200px; height: 630px; }
  .type { padding: 44px 48px 44px 56px; display: flex; flex-direction: column; }
  .name { font: 400 214px/.84 var(--display); letter-spacing: -0.035em; margin: 0 0 0 -6px; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 22px; padding-bottom: 22px; border-bottom: 6px solid var(--white); }
  .fs { font: 400 96px/.8 var(--display); }
  .when { font: 400 38px/1 var(--display); }
  .note { font: 400 44px/1.12 var(--display); letter-spacing: -0.01em; margin: 30px 0 0; }
  .photo { width: 600px; height: 630px; object-fit: cover; object-position: 3% 50%; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="type">
    <p class="name">늦깎이</p>
    <div class="row"><span class="fs">FS</span><span class="when">월<i class="dot"></i>목 20:30</span></div>
    <p class="note">같이 공 찰 사람,<br>못 차도 돼요.</p>
  </div>
  <img class="photo" src="/works/futsal/img/huddle-1600.webp" alt="">
</div>
<script>document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });</script>
</body>
</html>

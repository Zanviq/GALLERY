<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>늦깎이 FS OG card (dev, not deployed)</title>
<!-- Rendered to og/futsal.png by scripts/render-images.sh at 1200x630 with reduced motion
     (so the kick-in play sits at its start, arrows drawn). Uses the site's own fonts, CSS and board. -->
<link rel="stylesheet" href="/works/futsal/css/fonts.css">
<link rel="stylesheet" href="/works/futsal/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--court); color: var(--white); }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 448px 1fr; align-items: center; gap: 24px; padding: 0 40px 0 60px; box-sizing: border-box; }
  .card .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .card .crest { width: 64px; height: 64px; }
  .card .brand__name { font: 400 64px/1 var(--display); }
  .card h1 { font: 400 44px/1.14 var(--display); text-wrap: nowrap; letter-spacing: -0.01em; margin: 0 0 22px; }
  .card h1 span { display: block; }
  .card p { font: 700 19px/1.5 var(--body); color: var(--soft); margin: 0; max-width: 22em; }
  .card .board { display: block; }
  .card .board__stage { width: 628px; }
  .hidden { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand">
      <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" class="crest__ground"/>
        <g class="crest__lines">
          <rect x="2.5" y="9.25" width="27" height="13.5"/>
          <path d="M16 9.25 L16 22.75"/>
          <circle cx="16" cy="16" r="2.3"/>
          <path d="M2.5 10.88 A4.05 4.05 0 0 1 6.55 14.93 L6.55 17.07 A4.05 4.05 0 0 1 2.5 21.12"/>
          <path d="M29.5 10.88 A4.05 4.05 0 0 0 25.45 14.93 L25.45 17.07 A4.05 4.05 0 0 0 29.5 21.12"/>
        </g>
      </svg>
      <span class="brand__name">늦깎이 FS</span>
    </div>
    <h1><span>다들 헛발질부터 했어요.</span><span>지금은 작전판대로 뛰어요.</span></h1>
    <p>물굽이시 모래뜸 생활체육관, 월요일과 목요일 밤의 여자 풋살 클럽</p>
  </div>
  <div class="board" id="board">
    <div class="board__stage"><svg class="board__svg" viewBox="-2 -2 44 24"></svg></div>
    <div class="hidden">
      <p data-note></p><p data-status></p><ol data-moves></ol><ul data-setup></ul>
      <button data-act="play"><span></span></button><button data-act="undo"></button><button data-act="clear"></button>
      <input type="checkbox" data-joinbox>
      <h3 id="moves-title"></h3>
    </div>
  </div>
</div>
<script type="module">
  import { initBoard } from '/works/futsal/js/board/board.js';
  initBoard(document.getElementById('board'));
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    # Cloudflare 터널 뒤에서 /works/slug → /works/slug/ 리다이렉트가 :8080 을 달고 나가지 않게
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 시안 폴더는 이미지에 들어가지 않지만, 혹시 들어가도 열리지 않게 막아 둔다
    location ^~ /design/ {
        return 404;
    }

    # 숨김 파일(.gitkeep 등)은 서빙하지 않는다
    location ~ /\. {
        return 404;
    }

    # 작품 목록은 항상 최신본을 확인한다 (ETag 재검증)
    location = /data/works.json {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|mp3|ogg|wav|mp4|webm|wasm)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

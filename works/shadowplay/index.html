<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집채만 한 그림자: 종이 그림자극 무대</title>
<meta name="description" content="빛과 종이 인형을 끌어 막에 비친 그림자를 바꿔 보는 그림자극 무대예요. 빛이 가까우면 그림자가 커지고 흐려지고, 빛을 하나 더 켜면 그림자가 둘이 돼요. 가상 그림자극이에요.">
<meta name="theme-color" content="#10335A">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="zanviq gallery">
<meta property="og:title" content="집채만 한 그림자: 종이 그림자극 무대">
<meta property="og:description" content="빛을 끌어 종이 인형의 그림자를 키우고 줄여 보세요. 가상 그림자극이에요.">
<meta property="og:image" content="https://gallery.zanviq.dev/og/shadowplay.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://gallery.zanviq.dev/shadowplay/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="preload" href="./fonts/gamja-flower.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/site.css">
<script type="module" src="./js/main.js"></script>
<script src="/shared/back.js" data-position="top-left" data-theme="light" defer></script>
</head>
<body>
<div class="sheet">
  <header class="titleblock">
    <h1 class="titleblock__title">집채만 한 그림자</h1>
    <p class="titleblock__lead">빛을 끌어 보세요. 인형에 가까이 가면 그림자가 커지고 가장자리가 흐려져요.</p>
  </header>

  <main class="board">
    <div class="drawing" data-drawing role="group" aria-label="그림자극 무대 도면. 위는 위에서 본 무대, 아래는 관객이 보는 종이 막이에요." aria-describedby="keys">
      <canvas class="drawing__canvas" data-canvas aria-hidden="true"></canvas>
      <div class="drawing__targets" data-targets></div>
    </div>
    <p class="caption" data-caption aria-live="polite">공연 보기를 누르면 40초짜리 짧은 이야기가 시작돼요.</p>
  </main>

  <section class="side" aria-label="무대 조작">
    <div class="cues">
      <button class="btn btn--primary" type="button" data-show>공연 보기</button>
      <button class="btn" type="button" data-light2>빛 하나 더 켜기</button>
    </div>

    <div class="tools">
      <p class="tools__name" data-tool-name>인형을 누르면 여기서 돌리고, 뒤집고, 내릴 수 있어요.</p>
      <div class="tools__row" data-tool-row hidden>
        <button class="btn btn--icon" type="button" data-act="ccw" aria-label="왼쪽으로 15도 돌리기" title="왼쪽으로 돌리기">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 8.5a7 7 0 1 1-1.9 6.3"/><path d="M3.8 4.6v4.6h4.6"/></svg>
        </button>
        <button class="btn btn--icon" type="button" data-act="cw" aria-label="오른쪽으로 15도 돌리기" title="오른쪽으로 돌리기">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.5 8.5a7 7 0 1 0 1.9 6.3"/><path d="M20.2 4.6v4.6h-4.6"/></svg>
        </button>
        <button class="btn" type="button" data-act="flip">뒤집기</button>
        <button class="btn" type="button" data-act="remove">내리기</button>
      </div>
    </div>

    <section class="parts" aria-labelledby="parts-title">
      <h2 class="parts__title" id="parts-title">부품표</h2>
      <p class="parts__note">누르면 무대에 올리거나 내려요.</p>
      <ul class="parts__list" data-parts></ul>
    </section>

    <footer class="foot">
      <p class="foot__keys" id="keys">키보드: Tab으로 빛과 인형을 고르고 화살표로 옮겨요. R과 Shift+R은 돌리기, F는 뒤집기, Delete는 내리기, PageUp과 PageDown은 빛 높이예요.</p>
      <p class="foot__credit">가상 그림자극이에요. zanviq gallery 작품.</p>
    </footer>
  </section>
</div>
<p class="sr-only" data-status aria-live="polite"></p>
<noscript><p class="noscript">이 무대는 자바스크립트로 그림자를 계산해요. 자바스크립트를 켜면 빛과 인형을 움직일 수 있어요.</p></noscript>
</body>
</html>
